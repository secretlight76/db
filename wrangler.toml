# Cloudflare Pages Configuration
# Ensures consistent deployment to the same production environment
# Production URL: https://audio-level-converter.pages.dev

name = "audio-level-converter"
pages_build_output_dir = "public"

# Production environment
[env.production]
vars = { ENVIRONMENT = "production", ENABLE_ANALYTICS = "true", APP_VERSION = "1.0.0" }

# Preview environment (for pull requests)
[env.preview]
vars = { ENVIRONMENT = "preview", ENABLE_ANALYTICS = "false", APP_VERSION = "1.0.0-preview" }
